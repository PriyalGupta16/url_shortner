services:
  postgres:
    image: postgres:18
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: url_shortener
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: url-shortener-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
